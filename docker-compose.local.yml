services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard-local
    ports:
      - "7000:7000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    # Ensure hot reloading if you were using a dev-specific Dockerfile, 
    # but since we use the production Dockerfile, this runs the standalone build.
    # To use dev mode in Docker, you would need a different Dockerfile or target.

